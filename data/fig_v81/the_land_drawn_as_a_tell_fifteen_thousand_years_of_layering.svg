<svg viewBox="0 0 860 856" width="100%" role="img" aria-label="The history of Palestine drawn as an archaeological section"><rect width="860" height="856" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="11.0" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Read it from the bottom, the way a section is dug. Nothing here replaces the layer beneath it; every layer is built on the one before.</text><rect x="40" y="96.0" width="250" height="40.0" fill="#004A26"/><text x="52.0" y="114.0" font-size="12.6" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">today</text><text x="52.0" y="127.0" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">1994 →</text><text x="300.0" y="113.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A Palestinian city and the seat of an authority. 42,122 people in 2021.</text><line x1="40" y1="96.0" x2="820" y2="96.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="136.0" width="250" height="40.0" fill="#007A3D"/><text x="52.0" y="154.0" font-size="12.6" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">mandate, jordan, occupation</text><text x="52.0" y="167.0" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">1917–1994</text><text x="300.0" y="153.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The town is tripled by nine thousand refugees in 1948.</text><line x1="40" y1="136.0" x2="820" y2="136.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="176.0" width="250" height="60.0" fill="#007A3D"/><text x="52.0" y="204.0" font-size="12.6" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">ottoman</text><text x="52.0" y="217.0" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">1517–1917</text><rect x="40" y="176.0" width="250" height="60.0" fill="none" stroke="#C49A5E" stroke-width="3"/><text x="300.0" y="189.0" font-size="12.8" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.66" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">◀ we arrive here</text><text x="300.0" y="203.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The Ḥaddādīn arrive c. 1562 and are named in the register of 1596. This is the layer our own family enters.</text><line x1="40" y1="176.0" x2="820" y2="176.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="236.0" width="250" height="40.0" fill="#2A8A5C"/><text x="52.0" y="254.0" font-size="12.6" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">mamluk</text><text x="52.0" y="267.0" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">1250–1517</text><text x="300.0" y="247.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A sultan’s endowment of 1279 includes Rām Allāh (the deed is lost; a court</text><text x="300.0" y="259.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">record of 1565 cites it).</text><line x1="40" y1="236.0" x2="820" y2="236.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="276.0" width="250" height="34.0" fill="#55514A"/><text x="52.0" y="291.0" font-size="12.6" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">crusader &amp; ayyubid</text><text x="52.0" y="304.0" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">1099–1250</text><text x="300.0" y="284.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Franks settle al-Bīra as Magna Mahumeria and leave again — the one arrival</text><text x="300.0" y="296.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">that did not stay.</text><line x1="40" y1="276.0" x2="820" y2="276.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="310.0" width="250" height="40.0" fill="#3E9464"/><text x="52.0" y="328.0" font-size="12.6" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">early islamic</text><text x="52.0" y="341.0" font-size="9.5" fill="#FFFFFF" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">638–1099</text><text x="300.0" y="321.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The rulers change; the villages do not. A church is rebuilt at ʿAbūd in</text><text x="300.0" y="333.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1058.</text><line x1="40" y1="310.0" x2="820" y2="310.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="350.0" width="250" height="44.0" fill="#5FA97F"/><text x="52.0" y="370.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">byzantine</text><text x="52.0" y="383.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">324–638</text><text x="300.0" y="363.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The whole country turns Christian without anybody arriving. Churches at</text><text x="300.0" y="375.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Khirbet et-Tireh, ʿAbūd, Ṭaybeh.</text><line x1="40" y1="350.0" x2="820" y2="350.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="394.0" width="250" height="40.0" fill="#5DAA83"/><text x="52.0" y="412.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">roman</text><text x="52.0" y="425.0" font-size="12.3" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">63 bc – 324 ad</text><text x="300.0" y="405.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Gophna is the second city of Judaea. The ridge road is paved and</text><text x="300.0" y="417.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">milestoned.</text><line x1="40" y1="394.0" x2="820" y2="394.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="434.0" width="250" height="40.0" fill="#93C0A4"/><text x="52.0" y="452.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">hellenistic &amp; persian</text><text x="52.0" y="465.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">539–63 BC</text><text x="300.0" y="445.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Four empires; the same villages. The Samaritans separate and are still</text><text x="300.0" y="457.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">here.</text><line x1="40" y1="434.0" x2="820" y2="434.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="474.0" width="250" height="46.0" fill="#A9CDB8"/><text x="52.0" y="495.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">iron age</text><text x="52.0" y="508.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">1200–539 BC</text><text x="300.0" y="488.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Philistines on the coast, Moab and Edom across the river, Aramaeans inland</text><text x="300.0" y="500.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">— every one absorbed.</text><line x1="40" y1="474.0" x2="820" y2="474.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="520.0" width="250" height="60.0" fill="#C3D9CB"/><text x="52.0" y="548.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">bronze age</text><text x="52.0" y="561.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">3300–1200 BC</text><text x="300.0" y="535.0" font-size="10.1" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">et-Tell and ʿAin Samiya. Canaanite city-states write to Egypt in Akkadian.</text><text x="300.0" y="547.0" font-size="10.1" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Present-day Lebanese draw more than ninety per cent of their ancestry from</text><text x="300.0" y="559.0" font-size="10.1" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">this layer.</text><line x1="40" y1="520.0" x2="820" y2="520.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="580.0" width="250" height="36.0" fill="#D2E2D7"/><text x="52.0" y="596.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">chalcolithic</text><text x="52.0" y="609.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">4500–3300 BC</text><text x="300.0" y="595.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A village at Tell en-Naṣba, three kilometres from Ramallah’s centre.</text><line x1="40" y1="580.0" x2="820" y2="580.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="616.0" width="250" height="46.0" fill="#DFEAE2"/><text x="52.0" y="637.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">neolithic</text><text x="52.0" y="650.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">9600–4500 BC</text><text x="300.0" y="630.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jericho: permanent settlement, a stone tower, a wall. Motza and Abu Ghosh</text><text x="300.0" y="642.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">are day-walks away.</text><line x1="40" y1="616.0" x2="820" y2="616.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="662.0" width="250" height="50.0" fill="#E8EFE9"/><text x="52.0" y="685.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">natufian</text><text x="52.0" y="698.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">13,000–9600 BC</text><text x="300.0" y="678.0" font-size="10.1" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Shuqba cave, in this governorate: the first people here to build in stone</text><text x="300.0" y="690.0" font-size="10.1" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">and stay. The culture is named after their wadi.</text><line x1="40" y1="662.0" x2="820" y2="662.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><rect x="40" y="712.0" width="250" height="36.0" fill="#EFF2ED"/><text x="52.0" y="728.0" font-size="12.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">palaeolithic</text><text x="52.0" y="741.0" font-size="9.5" fill="#1A1915" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">before 13,000 BC</text><text x="300.0" y="721.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A Neanderthal child’s tooth in the same cave — the southernmost</text><text x="300.0" y="733.0" font-size="10.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Neanderthal yet identified.</text><line x1="40" y1="712.0" x2="820" y2="712.0" stroke="#FFFFFF" stroke-width=".8" opacity=".7"/><line x1="40" y1="748.0" x2="820" y2="748.0" stroke="#D9D4C8"/><text x="40.0" y="772.0" font-size="10.7" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Fifteen thousand years of human presence in this district, and not one layer in which the people of this land were replaced by another people.</text><text x="40.0" y="788.0" font-size="10.7" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The family arrives four layers from the top, into a district lived in — site by site, not always the same site — for more than eleven thousand years.</text><text x="40.0" y="804.0" font-size="10.7" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Layer thicknesses are drawn for legibility, not to scale in time. Every date is calibrated and sourced in the entries around this figure.</text></svg>