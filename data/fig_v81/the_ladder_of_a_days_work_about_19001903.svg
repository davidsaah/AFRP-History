<svg viewBox="0 0 860 470" width="100%" role="img" aria-label="Bar chart of daily wages in Ramallah around 1900 in piasters"><rect width="860" height="470" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="10.5" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">In piasters per day, when a piaster was worth five US cents. Building stone paid better than anything — which is why Ramallah men became masons, and why masons could afford to sail.</text><rect x="300" y="83" width="74" height="24" rx="2" fill="#007A3D" opacity="0.82"/><text x="288.0" y="100.0" font-size="10" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A boy in the fields</text><text x="384.1" y="100.0" font-size="10.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">4</text><rect x="300" y="127" width="111" height="24" rx="2" fill="#007A3D" opacity="0.82"/><text x="288.0" y="144.0" font-size="10" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A labourer</text><text x="421.1" y="144.0" font-size="10.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">6</text><text x="445.1" y="144.0" font-size="8.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the carriage to Jerusalem also cost 6</text><rect x="300" y="171" width="148" height="24" rx="2" fill="#007A3D" opacity="0.82"/><text x="288.0" y="188.0" font-size="10" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A doctor’s visit</text><text x="458.1" y="188.0" font-size="10.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">8</text><text x="482.1" y="188.0" font-size="8.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">from 6 to 10</text><rect x="300" y="215" width="324" height="24" rx="2" fill="#007A3D" opacity="0.82"/><text x="288.0" y="232.0" font-size="10" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">A craftsman</text><text x="634.1" y="232.0" font-size="10.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">17.5</text><text x="658.1" y="232.0" font-size="8.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">from 15 to 20</text><rect x="300" y="259" width="370" height="24" rx="2" fill="#007A3D" opacity="0.82"/><text x="288.0" y="276.0" font-size="10" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Hiring a man and mule to plow</text><text x="680.4" y="276.0" font-size="10.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">20</text><rect x="300" y="303" width="426" height="24" rx="2" fill="#C49A5E" opacity="1"/><text x="288.0" y="320.0" font-size="13.8" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">a mason</text><text x="735.9" y="320.0" font-size="10.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">23</text><text x="759.9" y="320.0" font-size="8.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">one silver majeedy — the top of the ladder</text><rect x="300" y="347" width="463" height="24" rx="2" fill="#007A3D" opacity="0.82"/><text x="288.0" y="364.0" font-size="10" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Hiring a man and oxen</text><text x="773.0" y="364.0" font-size="10.6" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">25</text><line x1="726" y1="82" x2="726" y2="380" stroke="#9A6324" stroke-width="1.2" stroke-dasharray="4 4"/><text x="725.9" y="76.0" font-size="8.8" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">one silver majeedy = 23 piasters</text><line x1="40" y1="414" x2="820" y2="414" stroke="#D9D4C8"/><text x="40.0" y="434.0" font-size="9.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The Christian head-tax that bought exemption from the army: one to two majeedy a year — a mason’s day or two. After the exemption ended (c. 1905–10), buying out of</text><text x="40.0" y="448.0" font-size="9.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">service cost 50 French gold francs — about 236 days of labouring. <tspan font-weight="700">America, before 1914, required only healthy eyes.</tspan> That is the whole economics of the emigration.</text></svg>