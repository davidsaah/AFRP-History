<svg viewBox="0 0 860 350" width="100%" role="img" aria-label="Five datings for the founding of Ramallah"><rect width="860" height="350" fill="#FFFFFF"/><text x="40.0" y="32.0" font-size="15.7" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.84" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">five datings, rarely set against one another</text><line x1="90" y1="168" x2="790" y2="168" stroke="#D9D4C8" stroke-width="2"/><line x1="90.0" y1="168" x2="90.0" y2="174" stroke="#8F8A80"/><text x="90.0" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1250</text><line x1="177.5" y1="168" x2="177.5" y2="174" stroke="#8F8A80"/><text x="177.5" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1300</text><line x1="265.0" y1="168" x2="265.0" y2="174" stroke="#8F8A80"/><text x="265.0" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1350</text><line x1="352.5" y1="168" x2="352.5" y2="174" stroke="#8F8A80"/><text x="352.5" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1400</text><line x1="440.0" y1="168" x2="440.0" y2="174" stroke="#8F8A80"/><text x="440.0" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1450</text><line x1="527.5" y1="168" x2="527.5" y2="174" stroke="#8F8A80"/><text x="527.5" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1500</text><line x1="615.0" y1="168" x2="615.0" y2="174" stroke="#8F8A80"/><text x="615.0" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1550</text><line x1="702.5" y1="168" x2="702.5" y2="174" stroke="#8F8A80"/><text x="702.5" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1600</text><line x1="790.0" y1="168" x2="790.0" y2="174" stroke="#8F8A80"/><text x="790.0" y="188.0" font-size="10.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1650</text><line x1="140.8" y1="168" x2="140.8" y2="202.0" stroke="#007A3D" stroke-width="1.2"/><circle cx="140.8" cy="168.0" r="6" fill="#007A3D" stroke="#FFFFFF" stroke-width="2"/><text x="140.8" y="216.0" font-size="13.2" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1279</text><text x="140.8" y="226.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Rām Allāh is a named place with</text><text x="140.8" y="238.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">surveyed boundaries in a Qalāwūn</text><text x="140.8" y="250.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">waqf</text><line x1="518.8" y1="168" x2="518.8" y2="102.0" stroke="#C49A5E" stroke-width="1.2"/><circle cx="518.8" cy="168.0" r="6" fill="#C49A5E" stroke="#FFFFFF" stroke-width="2"/><text x="518.8" y="88.0" font-size="13.2" fill="#9A6324" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1495</text><text x="518.8" y="62.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Mujīr al-Dīn does not mention it</text><text x="518.8" y="74.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">— the verified negative</text><line x1="595.8" y1="168" x2="595.8" y2="202.0" stroke="#007A3D" stroke-width="1.2"/><circle cx="595.8" cy="168.0" r="6" fill="#007A3D" stroke="#FFFFFF" stroke-width="2"/><text x="595.8" y="216.0" font-size="13.2" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1538–39</text><text x="595.8" y="226.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">an inhabited village of four</text><text x="595.8" y="238.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Muslim families, in the defter</text><line x1="636.0" y1="168" x2="636.0" y2="148.0" stroke="#007A3D" stroke-width="1.2"/><circle cx="636.0" cy="168.0" r="6" fill="#007A3D" stroke="#FFFFFF" stroke-width="2"/><text x="636.0" y="134.0" font-size="13.2" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1562</text><text x="636.0" y="108.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Christian households recorded —</text><text x="636.0" y="120.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the traditional founding</text><line x1="720.0" y1="168" x2="720.0" y2="248.0" stroke="#9A6324" stroke-width="1.2"/><circle cx="720.0" cy="168.0" r="6" fill="#9A6324" stroke="#FFFFFF" stroke-width="2"/><text x="720.0" y="262.0" font-size="13.2" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">early 1600s</text><text x="720.0" y="272.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Rāshid buys khirbat Rām Allāh</text><text x="720.0" y="284.0" font-size="10.3" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">from the Ghazāwina (al-Dabbāgh)</text><line x1="40" y1="310" x2="820" y2="310" stroke="#D9D4C8"/><text x="40.0" y="330.0" font-size="11.6" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The reconciliation: an old toponym on waqf-held ground, repopulated in stages, of which the Christian arrival of 1562 is one late layer.</text></svg>