<svg viewBox="0 0 860 300" width="100%" role="img" aria-label="Years from creation to Abraham in three text traditions"><rect width="860" height="300" fill="#FFFFFF"/><text x="40.0" y="34.0" font-size="14.3" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.84" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">years from creation to the birth of abraham, by text tradition</text><text x="40.0" y="52.0" font-size="10.5" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">A line to Adam implies a date for Adam — and the three surviving forms of the text disagree by 1,366 years.</text><text x="196.0" y="92.0" font-size="11.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Masoretic</text><rect x="210" y="70" width="253.3" height="34" fill="#007A3D" rx="3"/><rect x="465.3" y="70" width="44.7" height="34" fill="#007A3D" opacity=".42" rx="3"/><text x="336.6" y="92.0" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1,656</text><text x="487.6" y="92.0" font-size="10.5" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">292</text><text x="519.9" y="92.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1,948 total</text><text x="196.0" y="144.0" font-size="11.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Septuagint</text><rect x="210" y="122" width="342.9" height="34" fill="#9A6324" rx="3"/><rect x="554.9" y="122" width="164.0" height="34" fill="#9A6324" opacity=".42" rx="3"/><text x="381.4" y="144.0" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">2,242</text><text x="636.9" y="144.0" font-size="10.5" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1,072</text><text x="728.8" y="144.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">3,314 total</text><text x="196.0" y="196.0" font-size="11.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Samaritan</text><rect x="210" y="174" width="199.9" height="34" fill="#55514A" rx="3"/><rect x="411.9" y="174" width="144.1" height="34" fill="#55514A" opacity=".42" rx="3"/><text x="309.9" y="196.0" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1,307</text><text x="483.9" y="196.0" font-size="10.5" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">942</text><text x="566.0" y="196.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">2,249 total</text><rect x="210" y="238" width="13" height="13" fill="#6B6760" rx="2"/><text x="230.0" y="249.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Creation to the Flood</text><rect x="380" y="238" width="13" height="13" fill="#6B6760" opacity=".42" rx="2"/><text x="400.0" y="249.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Flood to the birth of Abraham</text><text x="40.0" y="282.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The Septuagint reckoning is the inherited one for a Rūm Orthodox family — which makes the choice of text</text><text x="40.0" y="298.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">itself a piece of family history. These are scripture, not chronology, and were never meant as chronology.</text></svg>