<svg viewBox="0 0 860 652" width="100%" role="img" aria-label="Diagram measuring how many generations are missing from the family chart"><rect width="860" height="652" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="10.5" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Generation 35 of the family chart is a single line. The arithmetic says it should be about thirty-one.</text><rect x="40" y="70" width="780" height="34" fill="#FFFFFF" stroke="#D9D4C8" rx="3"/><text x="52.0" y="91.0" font-size="11.4" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.78" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the sum</text><text x="118.0" y="85.0" font-size="8.4" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">569 → 1500</text><text x="118.0" y="97.0" font-size="10.4" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">931 years</text><text x="184.0" y="85.0" font-size="8.4" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">at 25 yrs a generation</text><text x="184.0" y="97.0" font-size="10.4" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">37</text><text x="305.2" y="85.0" font-size="8.4" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">at 30</text><text x="305.2" y="97.0" font-size="10.4" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">31</text><text x="367.2" y="85.0" font-size="8.4" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">at 32</text><text x="367.2" y="97.0" font-size="10.4" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">29</text><text x="429.2" y="85.0" font-size="8.4" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">at 35</text><text x="429.2" y="97.0" font-size="10.4" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">27</text><text x="491.2" y="85.0" font-size="8.4" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the chart draws</text><text x="491.2" y="97.0" font-size="10.4" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">2</text><text x="580.2" y="85.0" font-size="8.4" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">so, missing</text><text x="580.2" y="97.0" font-size="10.4" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">25–35</text><rect x="247.0" y="176" width="391.7" height="78" fill="#FAF5EC" stroke="#E9D7BD"/><line x1="260.1" y1="182" x2="260.1" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="272.7" y1="182" x2="272.7" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="285.3" y1="182" x2="285.3" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="297.9" y1="182" x2="297.9" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="310.6" y1="182" x2="310.6" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="323.2" y1="182" x2="323.2" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="335.8" y1="182" x2="335.8" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="348.4" y1="182" x2="348.4" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="361.1" y1="182" x2="361.1" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="373.7" y1="182" x2="373.7" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="386.3" y1="182" x2="386.3" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="398.9" y1="182" x2="398.9" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="411.5" y1="182" x2="411.5" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="424.2" y1="182" x2="424.2" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="436.8" y1="182" x2="436.8" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="449.4" y1="182" x2="449.4" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="462.0" y1="182" x2="462.0" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="474.7" y1="182" x2="474.7" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="487.3" y1="182" x2="487.3" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="499.9" y1="182" x2="499.9" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="512.5" y1="182" x2="512.5" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="525.2" y1="182" x2="525.2" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="537.8" y1="182" x2="537.8" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="550.4" y1="182" x2="550.4" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="563.0" y1="182" x2="563.0" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="575.6" y1="182" x2="575.6" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="588.3" y1="182" x2="588.3" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="600.9" y1="182" x2="600.9" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="613.5" y1="182" x2="613.5" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><line x1="626.1" y1="182" x2="626.1" y2="248" stroke="#D9BE96" stroke-width="1" opacity=".5"/><path d="M247.0 160 L638.8 160" stroke="#7A4E1C" stroke-width="1"/><text x="442.9" y="152.0" font-size="9.8" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">THE GAP IN OUR LINE — 931 years, about thirty-one generations, and only three of them named</text><text x="442.9" y="219.0" font-size="9.6" fill="#7A4E1C" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the chart draws one line across all of this</text><line x1="247.0" y1="170" x2="247.0" y2="260" stroke="#007A3D" stroke-width="3"/><circle cx="247.0" cy="215" r="7" fill="#007A3D" stroke="#FFFFFF" stroke-width="2"/><text x="235.0" y="182.0" font-size="13.3" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">generation 34</text><text x="235.0" y="196.0" font-size="8.9" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">al-Ḥārith ibn Jabala,</text><text x="235.0" y="207.0" font-size="8.9" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">phylarch, d. 569 —</text><text x="235.0" y="218.0" font-size="8.9" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Procopius names him</text><text x="235.0" y="229.0" font-size="8.9" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">in his own lifetime</text><line x1="638.8" y1="170" x2="638.8" y2="260" stroke="#007A3D" stroke-width="3"/><circle cx="638.8" cy="215" r="7" fill="#007A3D" stroke="#FFFFFF" stroke-width="2"/><text x="650.8" y="182.0" font-size="13.3" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">generation 36</text><text x="650.8" y="196.0" font-size="8.9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Rāshid al-Ḥaddādīn,</text><text x="650.8" y="207.0" font-size="8.9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">fl. c. 1500. His grand-</text><text x="650.8" y="218.0" font-size="8.9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">children reach the ridge</text><text x="650.8" y="229.0" font-size="8.9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">in 1562, and are counted</text><rect x="554.6" y="280" width="84.2" height="24" fill="#007A3D" opacity=".13" stroke="#007A3D"/><text x="638.8" y="318.0" font-size="9.8" fill="#004A26" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">THE GAP IN THE RECORD OF OUR PEOPLE — about two centuries, after c. 1300</text><path d="M247.0 292 L552.9 292" stroke="#007A3D" stroke-width="2.4"/><text x="400.8" y="286.0" font-size="8.6" fill="#004A26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">a Ghassān population is still named here</text><line x1="260.1" y1="338" x2="260.1" y2="343" stroke="#8F8A80"/><text x="260.1" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">600</text><line x1="302.2" y1="338" x2="302.2" y2="343" stroke="#8F8A80"/><text x="302.2" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">700</text><line x1="344.2" y1="338" x2="344.2" y2="343" stroke="#8F8A80"/><text x="344.2" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">800</text><line x1="386.3" y1="338" x2="386.3" y2="343" stroke="#8F8A80"/><text x="386.3" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">900</text><line x1="428.4" y1="338" x2="428.4" y2="343" stroke="#8F8A80"/><text x="428.4" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1000</text><line x1="470.5" y1="338" x2="470.5" y2="343" stroke="#8F8A80"/><text x="470.5" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1100</text><line x1="512.5" y1="338" x2="512.5" y2="343" stroke="#8F8A80"/><text x="512.5" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1200</text><line x1="554.6" y1="338" x2="554.6" y2="343" stroke="#8F8A80"/><text x="554.6" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1300</text><line x1="596.7" y1="338" x2="596.7" y2="343" stroke="#8F8A80"/><text x="596.7" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1400</text><line x1="638.8" y1="338" x2="638.8" y2="343" stroke="#8F8A80"/><text x="638.8" y="354.0" font-size="8.8" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1500</text><line x1="247.0" y1="338" x2="638.8" y2="338" stroke="#8F8A80"/><line x1="257.6" y1="340" x2="257.6" y2="372" stroke="#9A6324" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="257.6" cy="378" r="4" fill="#9A6324"/><text x="267.6" y="381.0" font-size="9.4" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">594</text><text x="301.6" y="381.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Our line stops in 569. In 593/4 the Greek writers stop naming the family.</text><line x1="295.4" y1="340" x2="295.4" y2="394" stroke="#007A3D" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="295.4" cy="400" r="4" fill="#007A3D"/><text x="305.4" y="403.0" font-size="9.4" fill="#007A3D" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">684</text><text x="339.4" y="403.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Marj Rāhiṭ — Kalb’s council at Jābiya makes a caliph; a Ghassanid secures Damascus</text><line x1="382.1" y1="340" x2="382.1" y2="416" stroke="#C49A5E" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="382.1" cy="422" r="5" fill="#C49A5E"/><text x="392.1" y="425.0" font-size="9.4" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">890</text><text x="426.1" y="425.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif"><tspan font-weight="700">al-Yaʿqūbī finds Ghassān in the Ghūṭa of Damascus — and at Gharandal, in Transjordan</tspan></text><line x1="452.8" y1="340" x2="452.8" y2="438" stroke="#007A3D" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="452.8" cy="444" r="4" fill="#007A3D"/><text x="462.8" y="447.0" font-size="9.4" fill="#007A3D" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1058</text><text x="496.8" y="447.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">ʿAbūd — a Syriac inscription names a patriarch, an archbishop and a priest</text><line x1="503.7" y1="340" x2="503.7" y2="460" stroke="#007A3D" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="503.7" cy="466" r="4" fill="#007A3D"/><text x="513.7" y="469.0" font-size="9.4" fill="#007A3D" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1179</text><text x="547.7" y="469.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jifnā — Ibrāhīm and his brothers, sons of Mūsā, named in stone at Choziba</text><line x1="520.1" y1="340" x2="520.1" y2="482" stroke="#007A3D" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="520.1" cy="488" r="4" fill="#007A3D"/><text x="530.1" y="491.0" font-size="9.4" fill="#007A3D" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1218</text><text x="564.1" y="491.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Shawbak — the pilgrim Thietmar finds Christians in the suburbs, 1217–18</text><line x1="563.4" y1="340" x2="563.4" y2="504" stroke="#007A3D" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="563.4" cy="510" r="4" fill="#007A3D"/><text x="573.4" y="513.0" font-size="9.4" fill="#007A3D" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1321</text><text x="607.4" y="513.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">al-Shawbak — a Christian majority (Abū al-Fidāʾ)</text><line x1="585.7" y1="340" x2="585.7" y2="526" stroke="#007A3D" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/><circle cx="585.7" cy="532" r="4" fill="#007A3D"/><text x="595.7" y="535.0" font-size="9.4" fill="#007A3D" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1374</text><text x="629.7" y="535.0" font-size="9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jifnā — Niʿma b. Bishāra, in the Ḥaram al-Sharīf documents</text><line x1="40" y1="564" x2="820" y2="564" stroke="#D9D4C8"/><text x="40.0" y="584.0" font-size="11.5" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The void is not empty of evidence. It is empty of names.</text><text x="40.0" y="602.0" font-size="10" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Eight dated records fall inside the stretch the chart leaves blank — and one of them, al-Yaʿqūbī writing in the ninth century, puts a Ghassān population in Transjordan by</text><text x="40.0" y="616.0" font-size="10" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">name, on the very plateau the family remembers. What no source supplies is a chain of fathers. The honest course is therefore not to invent thirty names, but to print the number.</text><text x="40.0" y="640.0" font-size="8.8" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Procopius, <tspan font-style="italic">Wars</tspan> I.17; Shahîd, <tspan font-style="italic">BASIC</tspan> I.1 (1995) for the silence after 593/4; Kennedy (2010) and al-Yaʿqūbī (d. 890); the ʿAbūd, Jifnā, Karak and Shawbak records as cited in Part II.</text></svg>