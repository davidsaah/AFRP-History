<svg viewBox="0 0 860 430" width="100%" role="img" aria-label="Recorded population of Ramallah 1596 to 2024, log scale, with the 1916 typhus epidemic marked"><rect width="860" height="430" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="10.5" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">A logarithmic scale, because the town multiplied by more than a hundred.</text><rect x="616.4" y="88" width="48.2" height="232" fill="#C49A5E" opacity=".10"/><text x="616.4" y="70.0" font-size="9" fill="#9A6324" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">British Mandate</text><rect x="694.2" y="88" width="42.0" height="232" fill="#C49A5E" opacity=".10"/><text x="736.2" y="82.0" font-size="9" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">occupation before the Authority</text><line x1="92" y1="297.6" x2="800" y2="297.6" stroke="#D9D4C8" stroke-width=".8"/><text x="82.0" y="301.6" font-size="9.5" fill="#8F8A80" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">500</text><line x1="92" y1="267.3" x2="800" y2="267.3" stroke="#D9D4C8" stroke-width=".8"/><text x="82.0" y="271.3" font-size="9.5" fill="#8F8A80" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1,000</text><line x1="92" y1="196.8" x2="800" y2="196.8" stroke="#D9D4C8" stroke-width=".8"/><text x="82.0" y="200.8" font-size="9.5" fill="#8F8A80" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">5,000</text><line x1="92" y1="166.5" x2="800" y2="166.5" stroke="#D9D4C8" stroke-width=".8"/><text x="82.0" y="170.5" font-size="9.5" fill="#8F8A80" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">10,000</text><line x1="92" y1="96.0" x2="800" y2="96.0" stroke="#D9D4C8" stroke-width=".8"/><text x="82.0" y="100.0" font-size="9.5" fill="#8F8A80" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">50,000</text><text x="123.1" y="340.0" font-size="9.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1600</text><line x1="123.1" y1="320" x2="123.1" y2="326" stroke="#8F8A80"/><text x="278.7" y="340.0" font-size="9.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1700</text><line x1="278.7" y1="320" x2="278.7" y2="326" stroke="#8F8A80"/><text x="434.3" y="340.0" font-size="9.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1800</text><line x1="434.3" y1="320" x2="434.3" y2="326" stroke="#8F8A80"/><text x="589.9" y="340.0" font-size="9.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1900</text><line x1="589.9" y1="320" x2="589.9" y2="326" stroke="#8F8A80"/><text x="745.5" y="340.0" font-size="9.5" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">2000</text><line x1="745.5" y1="320" x2="745.5" y2="326" stroke="#8F8A80"/><line x1="614.8" y1="88" x2="614.8" y2="320" stroke="#9A6324" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M614.8 225.4 q -6 26 2 46" fill="none" stroke="#9A6324" stroke-width="1.6"/><text x="606.8" y="213.4" font-size="10" fill="#7A4E1C" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1916 — typhus</text><text x="606.8" y="227.4" font-size="9.4" fill="#7A4E1C" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">“about 30 per cent</text><text x="606.8" y="239.4" font-size="9.4" fill="#7A4E1C" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">of Ramallah perish”</text><polyline points="116.9,307.4 493.5,274.4 495.0,267.3 543.3,236.9 583.7,235.6 597.7,216.2 624.2,217.7 638.2,203.6 658.4,186.7 660.0,196.1 672.4,153.3 684.9,149.4 694.2,158.0 740.9,141.1 756.4,122.2 772.0,106.9 782.9,101.7" fill="none" stroke="#007A3D" stroke-width="2" stroke-linejoin="round"/><polyline points="583.7,235.6 611.7,224.6 616.4,240.3 624.2,217.7" fill="none" stroke="#9A6324" stroke-width="1.6" stroke-dasharray="4 4" opacity=".9"/><circle cx="116.9" cy="307.4" r="4.5" fill="#FFFFFF" stroke="#007A3D" stroke-width="2"/><circle cx="493.5" cy="274.4" r="4.5" fill="#FFFFFF" stroke="#007A3D" stroke-width="2"/><circle cx="495.0" cy="267.3" r="4.5" fill="#FFFFFF" stroke="#007A3D" stroke-width="2"/><circle cx="543.3" cy="236.9" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="583.7" cy="235.6" r="4.5" fill="#FFFFFF" stroke="#007A3D" stroke-width="2"/><circle cx="597.7" cy="216.2" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="624.2" cy="217.7" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="638.2" cy="203.6" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="658.4" cy="186.7" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="660.0" cy="196.1" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="672.4" cy="153.3" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="684.9" cy="149.4" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="694.2" cy="158.0" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="740.9" cy="141.1" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="756.4" cy="122.2" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="772.0" cy="106.9" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="782.9" cy="101.7" r="4.5" fill="#8F8A80" stroke="#FFFFFF" stroke-width="1.6"/><text x="116.9" y="295.4" font-size="10" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">400</text><text x="597.7" y="203.2" font-size="10" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">3,214</text><text x="658.4" y="174.7" font-size="10" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">6,300</text><text x="672.4" y="141.3" font-size="10" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">13,500 — the refugees</text><text x="703.2" y="184.0" font-size="10" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">12,134 — counted under curfew</text><text x="772.0" y="94.9" font-size="10" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">38,998</text><circle cx="52" cy="378" r="4.5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.6"/><text x="64.0" y="382.0" font-size="10" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">an enumeration</text><circle cx="200" cy="378" r="4.5" fill="#FFFFFF" stroke="#007A3D" stroke-width="2"/><text x="212.0" y="382.0" font-size="10" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">an estimate, or a count of houses or taxable men</text><circle cx="560" cy="378" r="4.5" fill="#8F8A80"/><text x="572.0" y="382.0" font-size="10" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">projection</text><line x1="640" y1="378" x2="672" y2="378" stroke="#9A6324" stroke-width="1.6" stroke-dasharray="4 4"/><text x="680.0" y="382.0" font-size="10" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">inferred shape, not data</text><text x="40.0" y="396.0" font-size="10" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Two counts disagree: an estimate of about 1,100 is given for 1870, but the census Shāhīn cites for the same year counted 2,000. The chart follows the census.</text><text x="40.0" y="412.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The recorded points hide an event. Shāhīn records a typhus epidemic in 1916 killing about a third of the town; the dashed line shows what that means for the curve.</text></svg>