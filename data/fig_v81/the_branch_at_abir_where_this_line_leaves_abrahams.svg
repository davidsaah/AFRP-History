<svg viewBox="0 0 860 1108" width="100%" role="img" aria-label="Genesis genealogy showing the split at Eber between Peleg and Joktan"><rect width="860" height="1108" fill="#FFFFFF"/><text x="40.0" y="32.0" font-size="15.7" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.84" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the branch at eber — where this line leaves abraham’s</text><text x="40.0" y="50.0" font-size="11.6" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Genesis 10:25 gives Eber two sons. One is the line to Abraham and Moses. The other is ours. We do not descend from Abraham — we branch off six generations before him.</text><rect x="280" y="86" width="300" height="402" fill="#DFEEE6" stroke="#A9CDB8" rx="7"/><text x="430.0" y="105.0" font-size="13.7" fill="#2F6B48" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">genesis 5 and 11 — the shared trunk</text><text x="430.0" y="130.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Adam</text><text x="430.0" y="155.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Seth</text><text x="430.0" y="180.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Enosh</text><text x="430.0" y="205.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Kenan</text><text x="430.0" y="230.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Mahalalel</text><text x="430.0" y="255.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jared</text><text x="430.0" y="280.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Enoch</text><text x="430.0" y="305.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Methuselah</text><text x="430.0" y="330.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Lamech</text><text x="430.0" y="355.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Noah</text><text x="430.0" y="380.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Shem</text><text x="430.0" y="405.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Arpachshad</text><text x="430.0" y="430.0" font-size="13.6" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">(Kainan)</text><text x="534.0" y="430.0" font-size="9.7" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">LXX only</text><text x="430.0" y="455.0" font-size="13.6" fill="#1A1915" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Shelah</text><text x="430.0" y="480.0" font-size="20.0" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">ʿābir / eber</text><line x1="430" y1="496" x2="430" y2="524" stroke="#C49A5E" stroke-width="2.6"/><line x1="172" y1="524" x2="688" y2="524" stroke="#C49A5E" stroke-width="2.6"/><line x1="172" y1="524" x2="172" y2="552" stroke="#C49A5E" stroke-width="2.6"/><line x1="688" y1="524" x2="688" y2="552" stroke="#C49A5E" stroke-width="2.6"/><rect x="244" y="514" width="372" height="20" fill="#FFFFFF"/><text x="430.0" y="529.0" font-size="11.4" fill="#9A6324" text-anchor="middle" font-weight="700" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">GENESIS 10:25 — “and the name of his brother was Joktan”</text><rect x="28" y="550" width="288" height="318" fill="#F0EEEA" stroke="#CFCAC0" rx="7"/><text x="172.0" y="569.0" font-size="13.7" fill="#3A3731" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">peleg’s line — not ours</text><text x="162.0" y="596.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Peleg</text><text x="176.0" y="596.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Gen 11:18</text><text x="162.0" y="620.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Reu</text><text x="176.0" y="620.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Gen 11:20</text><text x="162.0" y="644.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Serug</text><text x="176.0" y="644.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Gen 11:22</text><text x="162.0" y="668.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Nahor</text><text x="176.0" y="668.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Gen 11:24</text><text x="162.0" y="692.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Terah</text><text x="176.0" y="692.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Gen 11:26</text><text x="162.0" y="716.0" font-size="19.4" fill="#3A3731" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">abraham</text><text x="176.0" y="716.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Gen 11:26</text><text x="162.0" y="740.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Isaac</text><text x="162.0" y="764.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jacob</text><text x="162.0" y="788.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Levi</text><text x="176.0" y="788.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Exod 6:16</text><text x="162.0" y="812.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Kohath</text><text x="176.0" y="812.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Exod 6:18</text><text x="162.0" y="836.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Amram</text><text x="176.0" y="836.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Exod 6:20</text><text x="162.0" y="860.0" font-size="19.4" fill="#3A3731" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">moses</text><text x="176.0" y="860.0" font-size="10.1" fill="#3A3731" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Exod 6:20</text><rect x="544" y="550" width="288" height="342" fill="#F6EFE3" stroke="#E9D7BD" rx="7"/><text x="688.0" y="569.0" font-size="13.7" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">joktan’s thirteen sons — ours</text><text x="678.0" y="596.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Almodad</text><text x="678.0" y="620.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Sheleph</text><text x="678.0" y="644.0" font-size="18.9" fill="#7A4E1C" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">hazarmaveth</text><text x="692.0" y="644.0" font-size="10.1" fill="#7A4E1C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">= Ḥaḍramawt</text><text x="678.0" y="668.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jerah</text><text x="678.0" y="692.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Hadoram</text><text x="678.0" y="716.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Uzal</text><text x="678.0" y="740.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Diklah</text><text x="678.0" y="764.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Obal</text><text x="678.0" y="788.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Abimael</text><text x="678.0" y="812.0" font-size="18.9" fill="#7A4E1C" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">sheba</text><text x="692.0" y="812.0" font-size="10.1" fill="#7A4E1C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">= Sabaʾ</text><text x="678.0" y="836.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ophir</text><text x="692.0" y="836.0" font-size="10.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">disputed</text><text x="678.0" y="860.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Havilah</text><text x="692.0" y="860.0" font-size="10.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">disputed</text><text x="678.0" y="884.0" font-size="13.4" fill="#1A1915" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jobab</text><line x1="40" y1="924" x2="820" y2="924" stroke="#D9D4C8"/><text x="40.0" y="948.0" font-size="11.7" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The split is three generations after the Flood — four in the Septuagint, which inserts Kainan — and six generations before</text><text x="40.0" y="965.0" font-size="11.7" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Abraham. Moses is seven names from Abraham, and stands on the other branch.</text><text x="40.0" y="987.0" font-size="11.7" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">So the answer to “where do we leave the line of Abraham and Moses?” is: we never joined it. We share Noah, Shem and Eber with</text><text x="40.0" y="1004.0" font-size="11.7" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">them, and part company at Eber’s two sons.</text><text x="40.0" y="1026.0" font-size="11.7" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Ḥaḍramawt and Sabaʾ are secure; Ophir, Havilah and Uzal are generally placed in South Arabia too, though argued over. Every</text><text x="40.0" y="1043.0" font-size="11.7" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">identification that can be made points to one country.</text><text x="40.0" y="1065.0" font-size="11.7" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">The Masoretic text gives fourteen names from Adam to Eber; the Septuagint gives fifteen, inserting Kainan, and Luke 3:36 follows</text><text x="40.0" y="1082.0" font-size="11.7" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the Septuagint.</text></svg>