<svg viewBox="0 0 860 520" width="100%" role="img" aria-label="The twelve lands named in the Sabaic inscription Riyam 2006-17 in the order the envoy crossed them"><rect width="860" height="520" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="11.0" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Riyam 2006-17: a Sabaean envoy is sent north, comes home, and has the road carved into a dedication to Taʾlab Riyām. Third century AD, probably c. 260–280.</text><line x1="62" y1="150" x2="798" y2="150" stroke="#D9BE96" stroke-width="3" stroke-linecap="round"/><line x1="62" y1="300" x2="798" y2="300" stroke="#D9BE96" stroke-width="3" stroke-linecap="round"/><path d="M798 150 q 34 0 34 34 t -34 34" fill="none" stroke="#D9BE96" stroke-width="3"/><text x="56.0" y="194.0" font-size="12.6" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">he sets out from sabaʾ</text><text x="56.0" y="206.0" font-size="9.0" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the highlands of Yemen</text><text x="56.0" y="396.0" font-size="12.6" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">and taʾlab riyām brought him back</text><text x="56.0" y="408.0" font-size="9.0" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">“from the land of the North”</text><circle cx="62.0" cy="150.0" r="15" fill="#E8F3ED" stroke="#007A3D" stroke-width="2.0"/><text x="62.0" y="153.4" font-size="9.9" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1</text><text x="62.0" y="123.0" font-size="10.9" fill="#004A26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Asdan</text><text x="62.0" y="101.5" font-size="8.7" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">al-Asd — the Azd,</text><text x="62.0" y="112.0" font-size="8.7" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the family’s own tribe</text><circle cx="209.2" cy="150.0" r="9" fill="#FFFFFF" stroke="#8F8A80" stroke-width="1.2"/><text x="209.2" y="153.4" font-size="9.0" fill="#8F8A80" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">2</text><text x="209.2" y="129.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Nizārum</text><text x="209.2" y="118.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Nizār</text><circle cx="356.4" cy="150.0" r="9" fill="#FFFFFF" stroke="#8F8A80" stroke-width="1.2"/><text x="356.4" y="153.4" font-size="9.0" fill="#8F8A80" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">3</text><text x="356.4" y="129.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Tanūkh</text><text x="356.4" y="107.5" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Tanūkh —</text><text x="356.4" y="118.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">lower Mesopotamia</text><circle cx="503.6" cy="150.0" r="9" fill="#FFFFFF" stroke="#8F8A80" stroke-width="1.2"/><text x="503.6" y="153.4" font-size="9.0" fill="#8F8A80" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">4</text><text x="503.6" y="129.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Liḥyān</text><text x="503.6" y="107.5" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Liḥyān — Dedan,</text><text x="503.6" y="118.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">al-ʿUlā</text><circle cx="650.8" cy="150.0" r="12" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.2"/><text x="650.8" y="153.4" font-size="9.0" fill="#9A6324" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">5</text><text x="650.8" y="126.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Tadmurum</text><text x="650.8" y="115.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif"><tspan font-weight="700">Palmyra</tspan></text><circle cx="798.0" cy="150.0" r="12" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.2"/><text x="798.0" y="153.4" font-size="9.0" fill="#9A6324" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">6</text><text x="798.0" y="126.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Nabaṭum</text><text x="798.0" y="104.5" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the Nabataeans —</text><text x="798.0" y="115.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Petra, and this country</text><circle cx="798.0" cy="300.0" r="12" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.2"/><text x="798.0" y="303.4" font-size="9.0" fill="#9A6324" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">7</text><text x="798.0" y="328.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Rumān</text><text x="798.0" y="340.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif"><tspan font-weight="700">Rome</tspan></text><circle cx="650.8" cy="300.0" r="9" fill="#FFFFFF" stroke="#8F8A80" stroke-width="1.2"/><text x="650.8" y="303.4" font-size="9.0" fill="#8F8A80" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">8</text><text x="650.8" y="325.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Lakhmum</text><text x="650.8" y="337.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Lakhm — al-Ḥīra,</text><text x="650.8" y="347.5" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the Persian client</text><circle cx="503.6" cy="300.0" r="15" fill="#E8F3ED" stroke="#007A3D" stroke-width="2.0"/><text x="503.6" y="303.4" font-size="9.9" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">9</text><text x="503.6" y="331.0" font-size="10.9" fill="#004A26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ghassān</text><text x="503.6" y="343.0" font-size="11.3" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">ghassān —</text><text x="503.6" y="353.5" font-size="8.7" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">already a land of its own</text><circle cx="356.4" cy="300.0" r="9" fill="#FFFFFF" stroke="#8F8A80" stroke-width="1.2"/><text x="356.4" y="303.4" font-size="9.0" fill="#8F8A80" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">10</text><text x="356.4" y="325.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Maʿaddum</text><text x="356.4" y="337.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Maʿadd</text><circle cx="209.2" cy="300.0" r="9" fill="#FFFFFF" stroke="#8F8A80" stroke-width="1.2"/><text x="209.2" y="303.4" font-size="9.0" fill="#8F8A80" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">11</text><text x="209.2" y="325.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ṭayyum</text><text x="209.2" y="337.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Ṭayyiʾ</text><circle cx="62.0" cy="300.0" r="9" fill="#FFFFFF" stroke="#8F8A80" stroke-width="1.2"/><text x="62.0" y="303.4" font-size="9.0" fill="#8F8A80" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">12</text><text x="62.0" y="325.0" font-size="10.1" fill="#1A1915" text-anchor="middle" font-weight="600" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Khaṣaṣatan</text><text x="62.0" y="337.0" font-size="8.7" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Khaṣaṣat</text><line x1="40" y1="448" x2="820" y2="448" stroke="#D9D4C8"/><text x="40.0" y="470.0" font-size="15.0" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the azd are stop one. ghassān is stop nine.</text><text x="40.0" y="486.0" font-size="9.9" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">In the third century AD they are two different lands, and the road between them runs past Palmyra, the Nabataeans, Rome and al-Ḥīra.</text><text x="40.0" y="500.0" font-size="9.9" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The dam’s first recorded breach is in 455 — a hundred and seventy-five years after this stone was cut.</text></svg>