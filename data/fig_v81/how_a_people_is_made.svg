<svg viewBox="0 0 860 710" width="100%" role="img" aria-label="Diagram showing successive peoples merging into the population of Palestine"><rect width="860" height="710" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="11.0" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Ten arrivals, one people. Every stream but two is still in the water — and the water was already flowing when the first of them arrived.</text><line x1="281.3" y1="84" x2="281.3" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="281.3" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1500 BCE</text><line x1="348.0" y1="84" x2="348.0" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="348.0" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1000 BCE</text><line x1="424.0" y1="84" x2="424.0" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="424.0" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">500 BCE</text><line x1="494.0" y1="84" x2="494.0" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="494.0" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">CE 1</text><line x1="564.0" y1="84" x2="564.0" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="564.0" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">500</text><line x1="640.0" y1="84" x2="640.0" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="640.0" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1000</text><line x1="720.0" y1="84" x2="720.0" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="720.0" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1500</text><line x1="812.0" y1="84" x2="812.0" y2="550" stroke="#D9D4C8" stroke-width=".8"/><text x="812.0" y="78.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">today</text><defs><linearGradient id="cf0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007A3D"/><stop offset="0.100" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4E9A72"/><stop offset="0.306" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55514A"/><stop offset="0.308" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C968B"/><stop offset="0.412" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A6324"/><stop offset="0.420" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C49A5E"/><stop offset="0.420" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf7" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55514A"/><stop offset="0.420" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf8" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C49A5E"/><stop offset="0.420" stop-color="#007A3D"/><stop offset="1" stop-color="#007A3D"/></linearGradient><linearGradient id="cf9" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A8A8A"/><stop offset="1" stop-color="#8A8A8A" stop-opacity=".22"/></linearGradient></defs><rect x="268.0" y="92.0" width="544.0" height="16" fill="url(#CF0)" rx="2"/><circle cx="268.0" cy="100.0" r="5" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="98.0" font-size="14.2" fill="#007A3D" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">canaanites</text><text x="252.0" y="110.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the population already here — the bed of the river</text><rect x="321.3" y="132.0" width="490.7" height="16" fill="url(#CF1)" rx="2"/><circle cx="321.3" cy="140.0" r="5" fill="#4E9A72" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="138.0" font-size="10.9" fill="#4E9A72" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Israelites</text><text x="252.0" y="150.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">emerging <tspan font-style="italic">from</tspan> these highlands, not into them</text><rect x="324.7" y="172.0" width="487.3" height="16" fill="url(#CF2)" rx="2"/><circle cx="324.7" cy="180.0" r="5" fill="#55514A" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="178.0" font-size="10.9" fill="#55514A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Philistines</text><text x="252.0" y="190.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">a real migration — visible in the genome at Ashkelon</text><path d="M324.7 196.0 L474.7 196.0" stroke="#55514A" stroke-width="1.3"/><path d="M324.7 192.0 L324.7 200.0 M474.7 192.0 L474.7 200.0" stroke="#55514A" stroke-width="1.3"/><text x="482.7" y="199.0" font-size="8.8" fill="#55514A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">two centuries, and undetectable</text><rect x="438.0" y="212.0" width="374.0" height="16" fill="#55514A" rx="2"/><circle cx="438.0" cy="220.0" r="5" fill="#55514A" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="218.0" font-size="10.9" fill="#55514A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Samaritans</text><text x="252.0" y="230.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">branch away — and are on Mount Gerizim to this day</text><text x="804.0" y="224.0" font-size="9.7" fill="#FFFFFF" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">still here</text><rect x="447.5" y="252.0" width="364.5" height="16" fill="url(#CF4)" rx="2"/><circle cx="447.5" cy="260.0" r="5" fill="#9C968B" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="258.0" font-size="10.9" fill="#9C968B" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Greeks</text><text x="252.0" y="270.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">cities, a language, and a new elite</text><rect x="478.6" y="292.0" width="333.4" height="16" fill="url(#CF5)" rx="2"/><circle cx="478.6" cy="300.0" r="5" fill="#9A6324" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="298.0" font-size="10.9" fill="#7A4E1C" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Idumaeans</text><text x="252.0" y="310.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">joined to Judaea under the Hasmoneans; gone as a name by 70 CE</text><rect x="508.8" y="332.0" width="303.2" height="16" fill="url(#CF6)" rx="2"/><circle cx="508.8" cy="340.0" r="5" fill="#C49A5E" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="338.0" font-size="10.9" fill="#9A6324" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Nabataeans</text><text x="252.0" y="350.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">their kingdom becomes the Roman province of Arabia</text><rect x="539.4" y="372.0" width="272.6" height="16" fill="url(#CF7)" rx="2"/><circle cx="539.4" cy="380.0" r="5" fill="#55514A" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="378.0" font-size="10.9" fill="#55514A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Romans, and the Church</text><text x="252.0" y="390.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the country turns Christian without anybody moving</text><rect x="584.7" y="412.0" width="227.3" height="16" fill="url(#CF8)" rx="2"/><circle cx="584.7" cy="420.0" r="5" fill="#C49A5E" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="418.0" font-size="10.9" fill="#9A6324" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">ARABS — and Ghassān</text><text x="252.0" y="430.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif"><tspan font-weight="700">the family’s own claimed stream</tspan></text><rect x="655.8" y="452.0" width="30.7" height="16" fill="url(#CF9)" rx="2"/><circle cx="655.8" cy="460.0" r="5" fill="#8A8A8A" stroke="#FFFFFF" stroke-width="1.4"/><text x="252.0" y="458.0" font-size="10.9" fill="#8A8A8A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Franks</text><text x="252.0" y="470.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the one arrival that mostly leaves again</text><path d="M686.6 460.0 l 24 -15" stroke="#8A8A8A" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/><text x="714.6" y="444.0" font-size="9.3" fill="#7A7A7A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">and leaves, 1187–1291</text><rect x="268" y="504" width="544" height="32" fill="#007A3D" rx="3"/><text x="280.0" y="525.0" font-size="11.6" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the people of this land</text><text x="800.0" y="525.0" font-size="15.7" fill="#FFFFFF" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0.48" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">palestinians</text><text x="252.0" y="519.0" font-size="10.7" fill="#007A3D" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">and what they became</text><text x="252.0" y="531.0" font-size="9.3" fill="#3D3A35" text-anchor="end" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">one people, ten arrivals</text><line x1="40" y1="596" x2="820" y2="596" stroke="#D9D4C8"/><text x="40.0" y="614.0" font-size="10.9" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The Philistine case is the one that can actually be measured, and it settles the argument:</text><text x="40.0" y="630.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">“Within no more than two centuries, this genetic footprint introduced during the early Iron Age is no longer detectable and seems to be diluted by a local</text><text x="40.0" y="644.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Levantine related gene pool.” — Feldman et al., <tspan font-style="italic">Science Advances</tspan> 5 (2019). <tspan font-weight="700">They were not driven out. They became the neighbours.</tspan></text><text x="40.0" y="664.0" font-size="10.5" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">And for the Levant as a whole: more than ninety per cent of present-day ancestry descends from the Bronze Age Canaanite population (Haber et al. 2017; Agranat-Tamir et al. 2020).</text><text x="40.0" y="700.0" font-size="9.2" fill="#8F8A80" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">The Crusaders are the exception, and are drawn as one: most Franks left or were expelled, and only a faint Y-chromosome trace survives (Haber et al. 2019).</text></svg>