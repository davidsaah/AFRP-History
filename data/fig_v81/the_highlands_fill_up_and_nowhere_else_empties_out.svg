rcle cx="535.5" cy="283.0" r="4.6" fill="#007A3D"/><circle cx="549.0" cy="283.0" r="4.6" fill="#007A3D"/><circle cx="562.5" cy="283.0" r="4.6" fill="#007A3D"/><circle cx="576.0" cy="283.0" r="4.6" fill="#007A3D"/><circle cx="589.5" cy="283.0" r="4.6" fill="#007A3D"/><circle cx="306.0" cy="296.5" r="4.6" fill="#007A3D"/><circle cx="319.5" cy="296.5" r="4.6" fill="#007A3D"/><circle cx="333.0" cy="296.5" r="4.6" fill="#007A3D"/><circle cx="346.5" cy="296.5" r="4.6" fill="#007A3D"/><circle cx="360.0" cy="296.5" r="4.6" fill="#007A3D"/><circle cx="373.5" cy="296.5" r="4.6" fill="#007A3D"/><circle cx="387.0" cy="296.5" r="4.6" fill="#007A3D"/><circle cx="400.5" cy="296.5" r="4.6" fill="#007A3D"/><text x="300.0" y="326.0" font-size="12.6" fill="#004A26" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">about 250 settlements — roughly 45,000 people</text><line x1="40" y1="392" x2="820" y2="392" stroke="#D9D4C8"/><text x="40.0" y="416.0" font-size="16.4" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">and here is what the jump is not</text><circle cx="47" cy="434" r="3.2" fill="#9A6324"/><text x="60.0" y="438.0" font-size="11.3" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">No destruction layer</text><text x="60.0" y="451.0" font-size="10.6" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The highland villages are new foundations on empty hilltops, not burnt towns rebuilt by somebody else.</text><circle cx="47" cy="468" r="3.2" fill="#9A6324"/><text x="60.0" y="472.0" font-size="11.3" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">No new pottery tradition</text><text x="60.0" y="485.0" font-size="10.6" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The cooking pots continue the local Late Bronze repertoire. A population arriving from outside brings its own kitchen; this one did not.</text><circle cx="47" cy="502" r="3.2" fill="#9A6324"/><text x="60.0" y="506.0" font-size="11.3" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">No arrival visible anywhere else</text><text x="60.0" y="519.0" font-size="10.6" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The coast and the Jordan valley show no matching emptying-out. Nobody moved from there to here in numbers.</text><line x1="40" y1="544" x2="820" y2="544" stroke="#D9D4C8"/><text x="40.0" y="566.0" font-size="12.0" fill="#004A26" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The people filling these hills were already in the country. What the Iron Age adds to this ridge is a name, not a population.</text></svg>