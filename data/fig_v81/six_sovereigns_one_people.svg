<svg viewBox="0 0 860 330" width="100%" role="img" aria-label="Timeline of the rulers of the Ramallah ridge from 539 to 63 BC, over a continuous band for the villages"><rect width="860" height="330" fill="#FFFFFF"/><text x="40.0" y="32.0" font-size="15.7" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.81" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">six sovereigns over one ridge, 539–63 bc</text><text x="40.0" y="50.0" font-size="11.4" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Who ruled these hills, reign by reign, above the people who farmed them throughout.</text><text x="60.0" y="74.0" font-size="12.3" fill="#8F8A80" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">who ruled</text><rect x="69.0" y="82" width="311.5" height="46" fill="#004A26" stroke="#FFFFFF" stroke-width="1.5"/><text x="224.8" y="105.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Persia</text><text x="224.8" y="118.0" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Achaemenid kings</text><rect x="380.6" y="82" width="46.7" height="46" fill="#9A6324" stroke="#FFFFFF" stroke-width="1.5"/><text x="403.9" y="109.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Macedon</text><rect x="427.2" y="82" width="152.0" height="46" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.5"/><text x="503.2" y="105.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ptolemies</text><text x="503.2" y="118.0" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">from Egypt</text><rect x="579.2" y="82" width="90.3" height="46" fill="#9A6324" stroke="#FFFFFF" stroke-width="1.5"/><text x="624.4" y="105.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Seleucids</text><text x="624.4" y="118.0" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">from Syria</text><rect x="669.5" y="82" width="115.9" height="46" fill="#007A3D" stroke="#FFFFFF" stroke-width="1.5"/><text x="727.4" y="105.0" font-size="11.0" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Hasmoneans</text><text x="727.4" y="118.0" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">local kings</text><rect x="785.4" y="82" width="34.6" height="46" fill="#1A1915"/><text x="791.4" y="109.0" font-size="11.0" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Rome</text><text x="60.0" y="160.0" font-size="12.3" fill="#8F8A80" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">who lived here</text><rect x="60" y="168" width="760" height="34" fill="#DFEEE6"/><line x1="60" y1="185" x2="820" y2="185" stroke="#007A3D" stroke-width="3"/><text x="440.0" y="181.0" font-size="10.6" fill="#004A26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the villages of the ridge, the same families on the same terraces</text><text x="440.0" y="198.0" font-size="9.9" fill="#004A26" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">five changes of sovereign, no change of population</text><line x1="60" y1="222" x2="820" y2="222" stroke="#8F8A80"/><line x1="127.7" y1="222" x2="127.7" y2="227" stroke="#8F8A80"/><text x="127.7" y="238.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">500 BC</text><line x1="278.2" y1="222" x2="278.2" y2="227" stroke="#8F8A80"/><text x="278.2" y="238.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">400 BC</text><line x1="428.7" y1="222" x2="428.7" y2="227" stroke="#8F8A80"/><text x="428.7" y="238.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">300 BC</text><line x1="579.2" y1="222" x2="579.2" y2="227" stroke="#8F8A80"/><text x="579.2" y="238.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">200 BC</text><line x1="729.7" y1="222" x2="729.7" y2="227" stroke="#8F8A80"/><text x="729.7" y="238.0" font-size="9.7" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">100 BC</text><line x1="70.5" y1="82" x2="70.5" y2="222" stroke="#9A6324" stroke-width="1" stroke-dasharray="3 3"/><rect x="67.0" y="218.5" width="7" height="7" fill="#9A6324" transform="rotate(45 70.5 222)"/><text x="70.5" y="254.0" font-size="9.9" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">edict of return, 538</text><line x1="490.4" y1="82" x2="490.4" y2="222" stroke="#9A6324" stroke-width="1" stroke-dasharray="3 3"/><rect x="486.9" y="218.5" width="7" height="7" fill="#9A6324" transform="rotate(45 490.4 222)"/><text x="490.4" y="254.0" font-size="9.9" fill="#9A6324" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Zenon’s journey, 259</text><line x1="785.4" y1="82" x2="785.4" y2="222" stroke="#9A6324" stroke-width="1" stroke-dasharray="3 3"/><rect x="781.9" y="218.5" width="7" height="7" fill="#9A6324" transform="rotate(45 785.4 222)"/><text x="785.4" y="254.0" font-size="9.9" fill="#9A6324" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Pompey, 63</text><line x1="40" y1="286" x2="820" y2="286" stroke="#D9D4C8"/><text x="40.0" y="304.0" font-size="11.2" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Empires came from Persia, Macedon, Egypt and Syria; the farmers of these hills stayed where they were.</text><text x="40.0" y="319.0" font-size="10.3" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Dates of rule as conventionally given; the Hasmonean start is taken as c. 140 BC. The Zenon papyri record Greek business letters from these towns in 259 BC.</text></svg>