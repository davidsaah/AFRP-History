<svg viewBox="0 0 860 400" width="100%" role="img" aria-label="Four panel strip of the war years: conscription, locusts, typhus, occupation"><rect width="860" height="400" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="13.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Four blows in five years — and the one in the middle is the largest demographic event in the town’s recorded history.</text><rect x="40" y="80" width="186" height="248" rx="6" fill="#FFFFFF" stroke="#D9D4C8"/><rect x="40" y="80" width="186" height="6" rx="3" fill="#8F8A80"/><text x="56.0" y="116.0" font-size="21.2" fill="#8F8A80" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1914</text><text x="56.0" y="136.0" font-size="15.6" fill="#8F8A80" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.96" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">conscription</text><text x="56.0" y="162.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">About 30 Ramallah men die</text><text x="56.0" y="177.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">in the Turkish army.</text><text x="56.0" y="207.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The exemption the head-tax</text><text x="56.0" y="222.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">once bought is gone.</text><rect x="238" y="80" width="186" height="248" rx="6" fill="#FFFFFF" stroke="#D9D4C8"/><rect x="238" y="80" width="186" height="6" rx="3" fill="#7A4E1C"/><text x="254.0" y="116.0" font-size="21.2" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1915</text><text x="254.0" y="136.0" font-size="15.6" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.96" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the locusts</text><text x="254.0" y="162.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">“No crops escape;</text><text x="254.0" y="177.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the economy suffers</text><text x="254.0" y="192.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">greatly.”</text><text x="254.0" y="222.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The qasr summers end</text><text x="254.0" y="237.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">in a stripped land.</text><rect x="436" y="80" width="186" height="248" rx="6" fill="#FFFFFF" stroke="#D9D4C8"/><rect x="436" y="80" width="186" height="6" rx="3" fill="#9A6324"/><text x="452.0" y="116.0" font-size="21.2" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1916</text><text x="452.0" y="136.0" font-size="15.6" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.96" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">typhus</text><text x="452.0" y="162.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">About 30% of the town</text><text x="452.0" y="177.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">perishes — roughly 950</text><text x="452.0" y="192.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">of 3,200 souls.</text><text x="452.0" y="222.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Among the dead: Hakeem</text><text x="452.0" y="237.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Abu Iskandar, the district’s</text><text x="452.0" y="252.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">only doctor.</text><rect x="634" y="80" width="186" height="248" rx="6" fill="#FFFFFF" stroke="#D9D4C8"/><rect x="634" y="80" width="186" height="6" rx="3" fill="#55514A"/><text x="650.0" y="116.0" font-size="21.2" fill="#55514A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1917</text><text x="650.0" y="136.0" font-size="15.6" fill="#55514A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.96" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">occupation</text><text x="650.0" y="162.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">27 December: the British</text><text x="650.0" y="177.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Army takes Ramallah,</text><text x="650.0" y="192.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">eighteen days after</text><text x="650.0" y="207.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jerusalem falls.</text><text x="650.0" y="237.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Four centuries of Ottoman</text><text x="650.0" y="252.0" font-size="11.8" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">rule end in an afternoon.</text><circle cx="458" cy="300" r="4.6" fill="#9A6324"/><circle cx="473" cy="300" r="4.6" fill="#9A6324"/><circle cx="488" cy="300" r="4.6" fill="#9A6324"/><circle cx="503" cy="300" r="4.6" fill="#D9D4C8"/><circle cx="518" cy="300" r="4.6" fill="#D9D4C8"/><circle cx="533" cy="300" r="4.6" fill="#D9D4C8"/><circle cx="548" cy="300" r="4.6" fill="#D9D4C8"/><circle cx="563" cy="300" r="4.6" fill="#D9D4C8"/><circle cx="578" cy="300" r="4.6" fill="#D9D4C8"/><circle cx="593" cy="300" r="4.6" fill="#D9D4C8"/><text x="452.0" y="320.0" font-size="10.5" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">three of every ten</text><line x1="40" y1="348" x2="820" y2="348" stroke="#D9D4C8"/><text x="40.0" y="368.0" font-size="12.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">No census sits on either side of 1916 — Schick counted 2,061 in 1896, Barron 3,104 in 1922 — so the catastrophe is invisible in every table. It survives only because</text><text x="40.0" y="382.0" font-size="12.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Shāhīn wrote it down, and his own doctor died in it. <tspan font-weight="700">This is why oral tradition is graded, kept, and never discarded in this book.</tspan></text></svg>