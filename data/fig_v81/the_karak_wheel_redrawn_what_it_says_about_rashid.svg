<svg viewBox="0 0 860 548" width="100%" role="img" aria-label="The Karak Haddadin genealogical wheel redrawn as two horizontal lines of descent from Saqr"><rect width="860" height="548" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="12.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">The hub of the Ḥaddādīn chart of al-Karak, set straight. Ṣaqr at the centre; one son keeps Karak, one son goes to Ramallah.</text><rect x="40" y="192" width="84" height="46" fill="none" stroke="#C49A5E" stroke-width="2.2" rx="6"/><rect x="44" y="196" width="76" height="38" fill="#F0F7F3" stroke="#3E9464" stroke-width="1.3" rx="3"/><text x="82.0" y="211.0" font-size="17.3" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">ṣaqr</text><text x="82" y="226" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">صقر</text><text x="82.0" y="250.0" font-size="12.0" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">“ عام ١٥٦١ ”</text><text x="82.0" y="263.0" font-size="9.9" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the year at the hub</text><line x1="120" y1="215" x2="138" y2="215" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><line x1="138" y1="115" x2="138" y2="325" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><line x1="138" y1="115" x2="158" y2="115" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><line x1="138" y1="325" x2="158" y2="325" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><text x="158.0" y="66.0" font-size="13.8" fill="#3E9464" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">one son keeps karak</text><text x="158.0" y="80.0" font-size="10.8" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the line the diwan then traces, generation by generation, to the present day</text><rect x="158" y="96" width="76" height="38" fill="#F0F7F3" stroke="#5DAA83" stroke-width="1.3" rx="3"/><text x="196.0" y="111.0" font-size="12.2" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ṣabra</text><text x="196" y="126" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">صبرة</text><line x1="234" y1="115" x2="244" y2="115" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><rect x="244" y="96" width="76" height="38" fill="#F0F7F3" stroke="#5DAA83" stroke-width="1.3" rx="3"/><text x="282.0" y="111.0" font-size="12.2" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ṣaqr</text><text x="282" y="126" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">صقر</text><line x1="320" y1="115" x2="330" y2="115" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><rect x="330" y="96" width="76" height="38" fill="#F0F7F3" stroke="#5DAA83" stroke-width="1.3" rx="3"/><text x="368.0" y="111.0" font-size="12.2" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ṣabra</text><text x="368" y="126" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">صبرة</text><line x1="406" y1="115" x2="416" y2="115" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><rect x="416" y="96" width="76" height="38" fill="#F0F7F3" stroke="#5DAA83" stroke-width="1.3" rx="3"/><text x="454.0" y="111.0" font-size="12.2" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">ʿĪsā</text><text x="454" y="126" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">عيسى</text><line x1="492" y1="115" x2="502" y2="115" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><rect x="502" y="96" width="76" height="38" fill="#F0F7F3" stroke="#5DAA83" stroke-width="1.3" rx="3"/><text x="540.0" y="111.0" font-size="12.2" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jiryis</text><text x="540" y="126" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">جريس</text><line x1="578" y1="115" x2="588" y2="115" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><rect x="588" y="96" width="76" height="38" fill="#F0F7F3" stroke="#5DAA83" stroke-width="1.3" rx="3"/><text x="626.0" y="111.0" font-size="12.2" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Mūsā</text><text x="626" y="126" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">موسى</text><line x1="664" y1="115" x2="674" y2="115" stroke="#3E9464" stroke-width="2.2" stroke-linecap="round"/><rect x="674" y="96" width="76" height="38" fill="#F0F7F3" stroke="#5DAA83" stroke-width="1.3" rx="3"/><text x="712.0" y="111.0" font-size="12.2" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Sālim</text><text x="712" y="126" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">سالم</text><line x1="750" y1="115" x2="762" y2="115" stroke="#6B6760" stroke-width="1.4" stroke-linecap="round"/><text x="766.0" y="108.0" font-size="10.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">and about</text><text x="766.0" y="120.0" font-size="10.8" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">150 more</text><text x="766.0" y="131.0" font-size="10.8" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">names</text><text x="158.0" y="276.0" font-size="13.8" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">one son goes to ramallah</text><text x="158.0" y="290.0" font-size="10.8" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">the chart writes his destination under his name, records his five sons, and stops there</text><rect x="158" y="306" width="76" height="38" fill="#F6EFE3" stroke="#C49A5E" stroke-width="1.3" rx="3"/><text x="196.0" y="321.0" font-size="17.3" fill="#1A1915" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.00" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">rāshid</text><text x="196" y="336" font-size="11.5" fill="#1A1915" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">راشد</text><rect x="240" y="314" width="56" height="22" fill="#C49A5E" rx="3"/><text x="268" y="330" font-size="12.0" fill="#FFFFFF" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">رام الله</text><line x1="296" y1="325" x2="310" y2="325" stroke="#C49A5E" stroke-width="2.2" stroke-linecap="round"/><rect x="310" y="306" width="76" height="38" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.3" rx="3"/><text x="348.0" y="321.0" font-size="12.2" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ḥaddād</text><text x="348" y="336" font-size="11.5" fill="#7A4E1C" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">حداد</text><line x1="386" y1="325" x2="396" y2="325" stroke="#C49A5E" stroke-width="1.5" stroke-linecap="round"/><rect x="396" y="306" width="76" height="38" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.3" rx="3"/><text x="434.0" y="321.0" font-size="12.2" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ibrāhīm</text><text x="434" y="336" font-size="11.5" fill="#7A4E1C" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">ابراهيم</text><line x1="472" y1="325" x2="482" y2="325" stroke="#C49A5E" stroke-width="1.5" stroke-linecap="round"/><rect x="482" y="306" width="76" height="38" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.3" rx="3"/><text x="520.0" y="321.0" font-size="12.2" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jiryis</text><text x="520" y="336" font-size="11.5" fill="#7A4E1C" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">جريس</text><line x1="558" y1="325" x2="568" y2="325" stroke="#C49A5E" stroke-width="1.5" stroke-linecap="round"/><rect x="568" y="306" width="76" height="38" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.3" rx="3"/><text x="606.0" y="321.0" font-size="12.2" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Shuqayr</text><text x="606" y="336" font-size="11.5" fill="#7A4E1C" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">شقير</text><line x1="644" y1="325" x2="654" y2="325" stroke="#C49A5E" stroke-width="1.5" stroke-linecap="round"/><rect x="654" y="306" width="76" height="38" fill="#FFFFFF" stroke="#C49A5E" stroke-width="1.3" rx="3"/><text x="692.0" y="321.0" font-size="12.2" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ḥasan</text><text x="692" y="336" font-size="11.5" fill="#7A4E1C" text-anchor="middle" font-family="Times New Roman, Times, serif" xml:lang="ar">حسن</text><line x1="310" y1="353" x2="730" y2="353" stroke="#C49A5E" stroke-width="1.2"/><text x="158.0" y="370.0" font-size="11.3" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The five fifths of Ramallah — the same five names, in the same order, as the</text><text x="158.0" y="383.0" font-size="11.3" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Ramallah tradition’s own division of the land among Rāshid’s sons.</text><line x1="40" y1="444" x2="820" y2="444" stroke="#D9D4C8"/><text x="40.0" y="464.0" font-size="12.0" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The Karak side, writing about itself, names Rāshid’s father, his brother, his destination and his five sons.</text><text x="40.0" y="478.0" font-size="10.8" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Redrawn from the radial chart in the Ḥaddādīn of al-Karak presentation, plate 84. The slide credits “Dr Munther Haddadeen, El-Haddadeen Tribe, Origins and Branches,</text><text x="40.0" y="492.0" font-size="10.8" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">Warda Books, 2025”; for the book itself, see the note in the text.</text><text x="40.0" y="506.0" font-size="10.8" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">The original is a wheel of about one hundred and sixty names in six rings. Its outer rings carry the modern Karak clan and are not transcribed here; nothing in the</text><text x="40.0" y="520.0" font-size="10.8" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">core has been altered.</text></svg>