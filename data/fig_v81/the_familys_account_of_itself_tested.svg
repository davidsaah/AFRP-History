<svg viewBox="0 0 860 372" width="100%" role="img" aria-label="Result of testing the family presentation against Shahin 1982"><rect width="860" height="372" fill="#FFFFFF"/><text x="40.0" y="32.0" font-size="19.3" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.84" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the family’s presentation, tested against its own 1982 history</text><text x="40.0" y="50.0" font-size="14.2" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">36 checkable claims, each read in Shāhīn’s Arabic text and against the external record.</text><rect x="196" y="83" width="260.0" height="23" fill="#007A3D" rx="2"/><text x="182.0" y="100.0" font-size="15.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Confirmed</text><text x="448.0" y="100.0" font-size="16.2" fill="#FFFFFF" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">13</text><text x="512.0" y="100.0" font-size="14.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the deck and Shāhīn agree</text><rect x="196" y="119" width="300.0" height="23" fill="#C49A5E" rx="2"/><text x="182.0" y="136.0" font-size="15.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">New</text><text x="488.0" y="136.0" font-size="16.2" fill="#FFFFFF" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">15</text><text x="512.0" y="136.0" font-size="14.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Shāhīn supplies what the deck did not have</text><rect x="196" y="155" width="60.0" height="23" fill="#5DAA83" rx="2"/><text x="182.0" y="172.0" font-size="15.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Refined</text><text x="248.0" y="172.0" font-size="16.2" fill="#FFFFFF" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">3</text><text x="512.0" y="172.0" font-size="14.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the date or detail sharpens</text><rect x="196" y="191" width="60.0" height="23" fill="#9A6324" rx="2"/><text x="182.0" y="208.0" font-size="15.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Corrected</text><text x="248.0" y="208.0" font-size="16.2" fill="#FFFFFF" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">3</text><text x="512.0" y="208.0" font-size="14.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the record differs from the deck</text><rect x="196" y="227" width="20.0" height="23" fill="#7A4E1C" rx="2"/><text x="182.0" y="244.0" font-size="15.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">In conflict</text><text x="224.0" y="244.0" font-size="16.2" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1</text><text x="512.0" y="244.0" font-size="14.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">irreconcilable as they stand</text><rect x="196" y="263" width="20.0" height="23" fill="#8F8A80" rx="2"/><text x="182.0" y="280.0" font-size="15.5" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Untested</text><text x="224.0" y="280.0" font-size="16.2" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">1</text><text x="512.0" y="280.0" font-size="14.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">no external check available</text><line x1="40" y1="306" x2="820" y2="306" stroke="#D9D4C8"/><text x="40.0" y="328.0" font-size="14.9" fill="#1A1915" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Three changed by the record and one open conflict, out of thirty-six.</text><text x="40.0" y="344.0" font-size="14.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The family’s account of itself survives the test in better shape than most published histories would.</text></svg>