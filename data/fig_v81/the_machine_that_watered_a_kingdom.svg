<svg viewBox="0 0 860 560" width="100%" role="img" aria-label="Schematic of the Marib dam, its sluices and its two irrigated gardens"><rect width="860" height="560" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="13.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">The great dam of Maʾrib: an earthen wall across the Wādī Dhana that turned flash-floods into two gardens — for more than a thousand years.</text><path d="M40 240 C 180 225, 240 250, 320 246 L 320 306 C 240 310, 180 330, 40 316 Z" fill="#EEF1F0" opacity=".8"/><text x="52.0" y="282.0" font-size="15.6" fill="#7D8986" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">wādī dhana</text><text x="52.0" y="296.0" font-size="11.0" fill="#7D8986" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">flash-floods off the highlands,</text><text x="52.0" y="308.0" font-size="11.0" fill="#7D8986" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">twice a year</text><path d="M300 108 L 352 218 L 248 218 Z" fill="#D9BE96" opacity=".65"/><path d="M300 444 L 352 330 L 248 330 Z" fill="#D9BE96" opacity=".65"/><text x="300.0" y="100.0" font-size="11.0" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jabal Balaq al-Awsaṭ</text><text x="300.0" y="462.0" font-size="11.0" fill="#7A4E1C" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Jabal Balaq al-Yamanī</text><rect x="316" y="218" width="18" height="112" rx="4" fill="#9A6324"/><text x="346.0" y="250.0" font-size="17.1" fill="#7A4E1C" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.66" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the dam</text><text x="346.0" y="265.0" font-size="11.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">an earthen wall, faced with stone —</text><text x="346.0" y="277.0" font-size="11.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">about 580 metres end to end, raised</text><text x="346.0" y="289.0" font-size="11.2" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">over the centuries from ~4 to ~14 m</text><rect x="312" y="206" width="26" height="14" fill="#004A26"/><text x="288.0" y="216.0" font-size="10.8" fill="#004A26" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the northern sluice</text><rect x="312" y="336" width="26" height="14" fill="#004A26"/><text x="288.0" y="346.0" font-size="10.8" fill="#004A26" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the southern sluice</text><path d="M338 213 C 430 190, 520 176, 640 168" fill="none" stroke="#EEF1F0" stroke-width="7"/><path d="M338 343 C 430 366, 520 380, 640 388" fill="none" stroke="#EEF1F0" stroke-width="7"/><ellipse cx="700" cy="168" rx="112" ry="52" fill="#007A3D" opacity=".18"/><ellipse cx="700" cy="168" rx="112" ry="52" fill="none" stroke="#007A3D" stroke-width="1.4"/><circle cx="610" cy="150" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="640" cy="150" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="670" cy="150" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="700" cy="150" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="730" cy="150" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="760" cy="150" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="790" cy="150" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="610" cy="184" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="640" cy="184" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="670" cy="184" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="700" cy="184" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="730" cy="184" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="760" cy="184" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="790" cy="184" r="3.2" fill="#007A3D" opacity=".7"/><text x="700.0" y="172.0" font-size="15.6" fill="#004A26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.66" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the northern garden</text><ellipse cx="700" cy="388" rx="112" ry="52" fill="#007A3D" opacity=".18"/><ellipse cx="700" cy="388" rx="112" ry="52" fill="none" stroke="#007A3D" stroke-width="1.4"/><circle cx="610" cy="370" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="640" cy="370" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="670" cy="370" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="700" cy="370" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="730" cy="370" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="760" cy="370" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="790" cy="370" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="610" cy="404" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="640" cy="404" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="670" cy="404" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="700" cy="404" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="730" cy="404" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="760" cy="404" r="3.2" fill="#007A3D" opacity=".7"/><circle cx="790" cy="404" r="3.2" fill="#007A3D" opacity=".7"/><text x="700.0" y="392.0" font-size="15.6" fill="#004A26" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.66" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">the southern garden</text><text x="700.0" y="262.0" font-size="12.5" fill="#004A26" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif"><tspan font-style="italic">“two gardens, on the right hand</tspan></text><text x="700.0" y="276.0" font-size="12.5" fill="#004A26" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif"><tspan font-style="italic">and on the left” — Qurʾān 34:15</tspan></text><text x="700.0" y="296.0" font-size="11.2" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">together some 9,600 hectares —</text><text x="700.0" y="308.0" font-size="11.2" fill="#3D3A35" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">about 24,000 acres under water control</text><line x1="40" y1="482" x2="820" y2="482" stroke="#D9D4C8"/><text x="40.0" y="500.0" font-size="11.8" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2" font-family="Times New Roman, Times, serif">8TH–7TH c. BCE</text><text x="40.0" y="515.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">Sabaean earthworks; the</text><text x="40.0" y="527.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">mukarribs’ inscriptions</text><text x="240.0" y="500.0" font-size="11.8" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2" font-family="Times New Roman, Times, serif">6TH c. BCE</text><text x="240.0" y="515.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the great masonry</text><text x="240.0" y="527.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">sluice towers built</text><text x="420.0" y="500.0" font-size="15.3" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0.72" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">~1,300 years</text><text x="420.0" y="515.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">of continuous operation —</text><text x="420.0" y="527.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the longest-serving machine</text><text x="420.0" y="539.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">in the ancient world</text><text x="640.0" y="500.0" font-size="11.8" fill="#9A6324" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2" font-family="Times New Roman, Times, serif">455 → c. 575 CE</text><text x="640.0" y="515.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">the dated breaches begin;</text><text x="640.0" y="527.0" font-size="11.1" fill="#3D3A35" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">final collapse near 575–580</text></svg>