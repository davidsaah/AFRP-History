<svg viewBox="0 0 860 250" width="100%" role="img" aria-label="Years per generation implied by 45 generations, against the observed range"><rect width="860" height="250" fill="#FFFFFF"/><text x="40.0" y="50.0" font-size="13.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">The gap from al-Ḥārith (d. 569) to Rāshid (fl. c. 1500) is 931 years. Dividing it 45 ways gives a</text><text x="40.0" y="64.0" font-size="13.1" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">male-line generation shorter than any observed population sustains.</text><rect x="610.0" y="96" width="60.0" height="64" fill="#007A3D" opacity=".16" rx="3"/><text x="640.0" y="90.0" font-size="13.7" fill="#007A3D" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.54" font-family="Times New Roman, Times, serif" style="font-variant:small-caps">observed range for male lines</text><rect x="250" y="106" width="248.3" height="22" fill="#9A6324" rx="3"/><text x="236.0" y="122.0" font-size="14.4" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">45 generations</text><text x="508.3" y="122.0" font-size="13.1" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">20.7 years per generation</text><text x="508.3" y="136.0" font-size="11.9" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">what the chart says</text><rect x="250" y="140" width="360.4" height="22" fill="#007A3D" rx="3"/><text x="236.0" y="156.0" font-size="14.4" fill="#1A1915" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">31 generations</text><text x="620.4" y="156.0" font-size="13.1" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">30.0 years per generation</text><text x="620.4" y="170.0" font-size="11.9" fill="#6B6760" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">what 30 years a generation gives</text><line x1="250.0" y1="176" x2="250.0" y2="181" stroke="#8F8A80"/><text x="250.0" y="194.0" font-size="11.9" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">0</text><line x1="370.0" y1="176" x2="370.0" y2="181" stroke="#8F8A80"/><text x="370.0" y="194.0" font-size="11.9" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">10</text><line x1="490.0" y1="176" x2="490.0" y2="181" stroke="#8F8A80"/><text x="490.0" y="194.0" font-size="11.9" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">20</text><line x1="610.0" y1="176" x2="610.0" y2="181" stroke="#8F8A80"/><text x="610.0" y="194.0" font-size="11.9" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">30</text><line x1="730.0" y1="176" x2="730.0" y2="181" stroke="#8F8A80"/><text x="730.0" y="194.0" font-size="11.9" fill="#8F8A80" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">40</text><line x1="250" y1="176" x2="730.0" y2="176" stroke="#D9D4C8"/><text x="490.0" y="212.0" font-size="12.5" fill="#6B6760" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0" font-family="Times New Roman, Times, serif">years per generation</text><text x="40.0" y="232.0" font-size="13.1" fill="#3D3A35" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0" font-family="Times New Roman, Times, serif">The count is wrong; the gap is real. Correcting the arithmetic does not close the void — it measures it honestly.</text></svg>